name: GDrive Scraper Transfer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  transfer_all:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xvfb ffmpeg gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
        sudo sh -c 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "yt-dlp[default]" requests google-api-python-client google-auth-oauthlib google-auth-httplib2 beautifulsoup4 DrissionPage

    - name: Select Target Site for Videos
      run: |
        SITE_INDEX="0"
        if [ -f site_rotation.txt ]; then
          SITE_INDEX=$(tr -d '[:space:]' < site_rotation.txt)
        fi

        case "$SITE_INDEX" in
          0)
            TARGET_URL="https://namethatpornad.com/"
            ;;
          1)
            TARGET_URL="https://fyptt.to/"
            ;;
          *)
            SITE_INDEX="0"
            TARGET_URL="https://namethatpornad.com/"
            ;;
        esac

        echo "TARGET_SITE_URL=$TARGET_URL" >> "$GITHUB_ENV"
        echo "SITE_INDEX=$SITE_INDEX" >> "$GITHUB_ENV"

    - name: Run Video Scraper
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || vars.GDRIVE_FOLDER_ID }}
      run: |
        xvfb-run --auto-servernum python main.py

    - name: Run Image Scraper
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || vars.GDRIVE_FOLDER_ID }}
      run: |
        xvfb-run --auto-servernum python image_scraper.py

    - name: Update All Histories
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ "${SITE_INDEX:-0}" = "0" ]; then
          echo "1" > site_rotation.txt
        else
          echo "0" > site_rotation.txt
        fi
        git add site_rotation.txt
        
        if [ -f download_history.txt ]; then
          git add download_history.txt
        fi
        
        if [ -f image_download_history.txt ]; then
          git add image_download_history.txt
        fi
        
        git commit -m "Update all scraper histories [skip ci]" || echo "No changes to commit."
        git push
