name: Web Video Downloader to Google Drive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" google-api-python-client google-auth-oauthlib google-auth-httplib2 beautifulsoup4 curl_cffi

      - name: Run script
        env:
          TARGET_SITE_URL: ${{ secrets.TARGET_SITE_URL }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          REVERSE_VIDEO_ORDER: ${{ secrets.REVERSE_VIDEO_ORDER || 'False' }}
          
          # تنظیمات بخش ترکیبی
          NEWEST_PAGES_TO_SCAN: '2'    # تعداد صفحات ثابت جدید که در هر بار اجرا اسکن می‌شوند
          PAGES_PER_RUN: '2'           # تعداد صفحات آرشیو قدیمی متحرک که اسکن و به جلو رانده می‌شوند
          MAX_DOWNLOADS_PER_RUN: '100' # حداکثر کل ویدیوهایی که در این نوبت دانلود می‌شوند
        run: python main.py

      # گام بروزرسانی‌شده برای کامیت دقیق فایل وضعیت صفحه و فایل تاریخچه
      - name: Commit and Push History to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # تلاش برای افزودن فایل‌ها در صورت وجود
          git add download_history.txt current_page.txt || true
          
          # بررسی وجود تغییرات قبل از انجام کامیت جهت جلوگیری از بروز خطای گیت‌هاب اکشن
          if git diff --staged --quiet; then
            echo "هیچ تغییری در تاریخچه یا صفحه ثبت نشد."
          else
            git commit -m "Update download history and page index [skip ci]"
            git push
          fi
